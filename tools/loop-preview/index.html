<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop preview</title>
<style>
  :root {
    --bg: #14120f; --panel: #1d1a16; --line: #34302a; --text: #f1eadf; --muted: #a39a8b; --accent: #e8b26a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 18px; margin: 0 0 14px; font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .grp { display: flex; align-items: center; gap: 8px; }
  label { color: var(--muted); font-size: 13px; }
  select, button { background: #26221d; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: #51493f; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  figcaption { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-weight: 600; }
  figcaption small { color: var(--muted); font-weight: 400; }
  .stage { position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .missing { position: absolute; inset: 0; display: none; place-items: center; text-align: center; color: var(--muted); padding: 20px; }
  .stage.is-missing .missing { display: grid; }
  .stage.is-missing video { visibility: hidden; }
  .meta { margin-top: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta b { color: var(--text); font-weight: 500; }
  .status { margin-top: 14px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Loop preview: original vs encoded</h1>

  <div class="bar">
    <div class="grp">
      <button id="prev" aria-label="Previous avatar" title="Left arrow">&larr;</button>
      <select id="pick" aria-label="Avatar"></select>
      <button id="next" aria-label="Next avatar" title="Right arrow">&rarr;</button>
    </div>
    <div class="grp">
      <label for="rate">Speed</label>
      <select id="rate">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="1" selected>1x</option><option value="2">2x</option>
      </select>
    </div>
    <div class="grp"><button id="play" title="Space">Pause</button></div>
  </div>

  <div class="pair">
    <figure>
      <figcaption><span>Original <small>masters/mp4</small></span><small id="oInfo"></small></figcaption>
      <div class="stage" id="oStage"><video id="oVid" loop muted playsinline preload="auto"></video><div class="missing"><div>No master for this avatar</div></div></div>
      <div class="meta" id="oMeta"></div>
    </figure>
    <figure>
      <figcaption><span>Encoded <small>assets/mp4</small></span><small id="eInfo"></small></figcaption>
      <div class="stage" id="eStage"><video id="eVid" loop muted playsinline preload="auto"></video><div class="missing"><div>Not encoded yet<br><small>run pnpm encode:videos</small></div></div></div>
      <div class="meta" id="eMeta"></div>
    </figure>
  </div>

  <div class="status" id="status"></div>
  <p class="hint">Both clips loop continuously, started together when you switch avatar. Keys: &larr; &rarr; switch avatar, space play/pause.</p>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("loopPreview." + k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("loopPreview." + k, v); } catch {} },
  };
  const vids = { o: $("#oVid"), e: $("#eVid") };
  const stages = { o: $("#oStage"), e: $("#eStage") };
  const missing = { o: false, e: false };
  let data, ids = [], idx = 0, playing = true;

  const fmtKB = (b) => (b / 1024 >= 1000 ? (b / 1048576).toFixed(2) + " MB" : Math.round(b / 1024) + " KB");
  const rate = () => Number($("#rate").value);

  function meta(k) {
    const v = vids[k], id = ids[idx], size = data[k === "o" ? "masters" : "encoded"][id];
    const el = k === "o" ? $("#oMeta") : $("#eMeta");
    if (missing[k]) { el.innerHTML = ""; return; }
    const frames = v.duration ? Math.round(v.duration * 30) : "?";
    el.innerHTML = `<span><b>${v.videoWidth}&times;${v.videoHeight}</b></span><span><b>${(v.duration || 0).toFixed(3)} s</b> (~${frames} frames @30)</span><span><b>${fmtKB(size)}</b></span>`;
  }

  function status() {
    const a = data.avatars.find((x) => x.id === ids[idx]);
    $("#status").innerHTML = `${a ? a.id + " &middot; " + a.name : ids[idx]}`;
  }

  function startBoth() {
    const live = ["o", "e"].filter((k) => !missing[k]);
    live.forEach((k) => { vids[k].pause(); vids[k].currentTime = 0; });
    if (playing) live.forEach((k) => vids[k].play().catch(() => {}));
  }

  function load(i) {
    idx = (i + ids.length) % ids.length;
    const id = ids[idx];
    $("#pick").value = id; store.set("id", id);
    let pending = 0;
    for (const k of ["o", "e"]) {
      const v = vids[k], has = !!data[k === "o" ? "masters" : "encoded"][id];
      missing[k] = !has; stages[k].classList.toggle("is-missing", !has);
      v.pause();
      if (!has) { v.removeAttribute("src"); v.load(); meta(k); continue; }
      pending++;
      v.src = `/${k === "o" ? "masters" : "encoded"}/${id}.mp4?` + Date.now();
      v.playbackRate = rate();
      v.onloadeddata = () => { meta(k); if (--pending === 0) startBoth(); };
    }
    status();
  }

  function togglePlay() {
    playing = !playing; $("#play").textContent = playing ? "Pause" : "Play";
    for (const k of ["o", "e"]) if (!missing[k]) { if (playing) vids[k].play().catch(() => {}); else vids[k].pause(); }
  }

  async function boot() {
    if (location.protocol === "file:") {
      $("#status").innerHTML = 'This page needs its server. Run <b>pnpm preview:loops</b> and open <b>http://localhost:4174</b> (not the file directly).';
      return;
    }
    try { data = await fetch("/api/list").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }); }
    catch (err) { $("#status").textContent = "Could not load /api/list (" + err.message + "). Is pnpm preview:loops running?"; return; }
    ids = [...new Set([...Object.keys(data.masters), ...Object.keys(data.encoded)])].sort();
    if (!ids.length) { $("#status").textContent = "No videos found in masters/mp4 or assets/mp4."; return; }
    $("#pick").innerHTML = ids.map((id) => {
      const a = data.avatars.find((x) => x.id === id);
      const tag = data.encoded[id] ? "" : " (not encoded)";
      return `<option value="${id}">${id} &middot; ${a ? a.name : ""}${tag}</option>`;
    }).join("");
    $("#rate").value = store.get("rate", "1");
    $("#pick").onchange = (e) => load(ids.indexOf(e.target.value));
    $("#prev").onclick = () => load(idx - 1);
    $("#next").onclick = () => load(idx + 1);
    $("#rate").onchange = () => { store.set("rate", $("#rate").value); for (const k of ["o", "e"]) vids[k].playbackRate = rate(); };
    $("#play").onclick = togglePlay;
    addEventListener("keydown", (e) => {
      if (e.target.matches("select")) return;
      if (e.key === "ArrowLeft") load(idx - 1);
      else if (e.key === "ArrowRight") load(idx + 1);
      else if (e.key === " ") { e.preventDefault(); togglePlay(); }
    });
    const saved = ids.indexOf(store.get("id", ids[0]));
    load(saved < 0 ? 0 : saved);
  }

  boot();
})();
</script>
</body>
</html>
